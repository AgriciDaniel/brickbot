<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" role="img" aria-label="NOKAI animated LCD banner">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect y="2" width="4" height="1" fill="#1c3421" opacity="0.06"/>
      <rect x="2" width="1" height="4" fill="#1c3421" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- navy bezel -->
  <rect x="0" y="0" width="800" height="230" rx="22" fill="#1a2338"/>
  <rect x="3" y="3" width="794" height="224" rx="19" fill="#232e4c"/>

  <!-- LCD -->
  <rect x="14" y="14" width="772" height="202" rx="10" fill="#a8b795"/>
  <rect x="14" y="14" width="772" height="202" rx="10" fill="url(#scan)"/>

  <!-- status bar -->
  <g fill="#1c3421" font-family="ui-monospace, 'Courier New', monospace" font-size="15" font-weight="bold">
    <text x="36" y="45">&#9776;</text>
    <text x="400" y="45" text-anchor="middle">16:52</text>
  </g>
  <!-- signal bars, searching -->
  <g fill="#1c3421">
    <rect x="726" y="38" width="5" height="8">
      <animate attributeName="opacity" values="0.15;1;1;1;1" keyTimes="0;0.2;0.5;0.9;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="734" y="34" width="5" height="12">
      <animate attributeName="opacity" values="0.15;0.15;1;1;0.15" keyTimes="0;0.2;0.4;0.9;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="742" y="30" width="5" height="16">
      <animate attributeName="opacity" values="0.15;0.15;0.15;1;0.15" keyTimes="0;0.3;0.5;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="750" y="26" width="5" height="20">
      <animate attributeName="opacity" values="0.15;0.15;0.15;0.15;1" keyTimes="0;0.4;0.6;0.8;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title -->
  <text x="390" y="132" text-anchor="middle" fill="#1c3421"
        font-family="ui-monospace, 'Courier New', monospace" font-size="64" font-weight="bold" letter-spacing="6">NOKAI</text>
  <!-- blinking block cursor -->
  <rect x="510" y="94" width="24" height="42" fill="#1c3421">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5001;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- blinking prompt -->
  <text x="400" y="182" text-anchor="middle" fill="#1c3421"
        font-family="ui-monospace, 'Courier New', monospace" font-size="17" font-weight="bold" letter-spacing="3">
    PRESS &#9472; TO TALK
    <animate attributeName="opacity" values="1;1;0.25;0.25" keyTimes="0;0.55;0.5501;1" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <!-- snake: segments chasing around the LCD border -->
  <g fill="#1c3421">
    <rect x="-6" y="-6" width="12" height="12">
      <animateMotion dur="12s" begin="0s" repeatCount="indefinite"
        path="M 40,64 L 760,64 L 760,192 L 40,192 Z"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12">
      <animateMotion dur="12s" begin="-0.18s" repeatCount="indefinite"
        path="M 40,64 L 760,64 L 760,192 L 40,192 Z"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12">
      <animateMotion dur="12s" begin="-0.36s" repeatCount="indefinite"
        path="M 40,64 L 760,64 L 760,192 L 40,192 Z"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12">
      <animateMotion dur="12s" begin="-0.54s" repeatCount="indefinite"
        path="M 40,64 L 760,64 L 760,192 L 40,192 Z"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12">
      <animateMotion dur="12s" begin="-0.72s" repeatCount="indefinite"
        path="M 40,64 L 760,64 L 760,192 L 40,192 Z"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12">
      <animateMotion dur="12s" begin="-0.90s" repeatCount="indefinite"
        path="M 40,64 L 760,64 L 760,192 L 40,192 Z"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12">
      <animateMotion dur="12s" begin="-1.08s" repeatCount="indefinite"
        path="M 40,64 L 760,64 L 760,192 L 40,192 Z"/>
    </rect>
  </g>

  <!-- food: blinks somewhere the snake will pass -->
  <rect x="754" y="122" width="10" height="10" fill="#1c3421">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
